<article class="entry" data-tags="${tags}" data-original-index="${entryIndex}">
    <details class="post" name="posts">
        <summary>
            <h3 style="display:inline-block; margin: 0;">${title}</h3>
            <div class="post-intro">
                ${intro}
            </div>
        </summary>
        <div class="post-body">
            ${body}
            <p name="tags">tags: ${tags}</p>
            <input type="button" value="minimize" onclick="this.parentElement.parentElement.removeAttribute('open')"/>
        </div>
    </details>
</article>
