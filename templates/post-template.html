<article class="entry">
    <details class="post" name="posts" data-tags="${tags}" data-original-index="${entryIndex}">
        <summary>
            <h3 style="display:inline-block; margin: 0;">${title}</h3>
            ${intro}
        </summary>
        ${body}
        <p name="tags">tags: ${tags}</p>
    </details>
</article>
