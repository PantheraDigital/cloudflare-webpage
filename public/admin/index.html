<!DOCTYPE html>
<html lang="en">

<head>
    <title>Admin</title>
    <meta charset="utf-8">
    <meta name="author" content="Panthera">
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            color-scheme: light dark;
        }

        html[data-theme="light"] { color-scheme: light; }
        html[data-theme="dark"] { color-scheme: dark; }
    </style>
</head>

<body>
    <a href="/">/</a>
    <button type="button" id="force-render" onclick="forceRender()">/force-render</button>

    <div id="request-response"></div>
    <script>
        const outputDiv = document.getElementById("request-response");
        const btn = document.getElementById("force-render");

        async function forceRender() {
            btn.disabled = true;
            outputDiv.innerText = "Processing request...";

            try {
                const response = await fetch("/admin/force-render", { method: "POST" });
                
                const text = await response.text();
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${text}`);
                }
                outputDiv.innerText = text;

            } catch (error) {
                outputDiv.innerText = "Error: " + error.message;

            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
